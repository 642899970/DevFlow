models:
  - id: mimo-pro
    provider: openai_compatible
    model_name: mimo-v2.5-pro
    base_url: https://api.mimo.xiaomi.com/v1
    api_key_env: MIMO_API_KEY
    default_params:
      temperature: 0.1
      max_tokens: 8000

  - id: gpt4o
    provider: openai
    model_name: gpt-4o
    api_key_env: OPENAI_API_KEY
    default_params:
      temperature: 0.7
      max_tokens: 4096

  - id: sonnet
    provider: anthropic
    model_name: claude-sonnet-4-20250514
    api_key_env: ANTHROPIC_API_KEY
    default_params:
      temperature: 0.7
      max_tokens: 4096

  - id: gpt4-turbo
    provider: openai
    model_name: gpt-4-turbo-preview
    api_key_env: OPENAI_API_KEY
    default_params:
      temperature: 0.7
      max_tokens: 4096
